<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }}</title>
<meta name="description" content="{{ description }}">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:type" content="{{ og_type }}">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="{{ root }}style.css">
<link rel="alternate" type="application/atom+xml" title="{{ site_title }}" href="{{ root }}feed.xml">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128269;</text></svg>">
{{ head_extra }}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap header-bar">
    <a class="site-name" href="{{ root }}index.html">{{ site_title }}</a>
    <nav class="site-nav">
      <a href="{{ root }}index.html">All</a>
      <a href="{{ root }}feed.xml">Feed</a>
      <a href="{{ repo_url }}">Source</a>
    </nav>
  </div>
  <div class="wrap header-scene">
    <svg class="scene" viewBox="0 0 640 110" preserveAspectRatio="xMaxYMax slice" role="img"
         aria-label="A reporter in a trench coat studies the ground through a magnifying glass while his white terrier follows a trail of paw prints.">
      <defs>
        <symbol id="paw" viewBox="0 0 12 12">
          <ellipse cx="6" cy="8.2" rx="3.3" ry="2.5"/>
          <circle cx="2.5" cy="4.6" r="1.25"/>
          <circle cx="5.3" cy="3.2" r="1.25"/>
          <circle cx="8.2" cy="3.6" r="1.25"/>
          <circle cx="10.2" cy="6" r="1.1"/>
        </symbol>
      </defs>
      <!-- the trail leads away to the left, shrinking and fading as it goes cold -->
      <g class="scene-trail">
        <use href="#paw" x="485" y="87" width="14" height="14" opacity="0.85"/>
        <use href="#paw" x="423" y="90" width="13" height="13" opacity="0.80"/>
        <use href="#paw" x="380" y="84" width="13" height="13" opacity="0.75"/>
        <use href="#paw" x="343" y="87" width="12" height="12" opacity="0.71"/>
        <use href="#paw" x="309" y="81" width="12" height="12" opacity="0.66"/>
        <use href="#paw" x="277" y="84" width="11" height="11" opacity="0.61"/>
        <use href="#paw" x="247" y="78" width="11" height="11" opacity="0.56"/>
        <use href="#paw" x="218" y="81" width="10" height="10" opacity="0.51"/>
        <use href="#paw" x="189" y="75" width="10" height="10" opacity="0.47"/>
        <use href="#paw" x="162" y="78" width="9" height="9" opacity="0.42"/>
        <use href="#paw" x="136" y="72" width="9" height="9" opacity="0.37"/>
        <use href="#paw" x="110" y="75" width="8" height="8" opacity="0.32"/>
        <use href="#paw" x="85" y="69" width="8" height="8" opacity="0.27"/>
        <use href="#paw" x="60" y="72" width="7" height="7" opacity="0.23"/>
        <use href="#paw" x="36" y="66" width="7" height="7" opacity="0.18"/>
        <use href="#paw" x="12" y="69" width="6" height="6" opacity="0.13"/>
      </g>
      <image href="{{ root }}investigators.png" x="485" y="0.5" width="149" height="100"/>
    </svg>
  </div>
</header>
<main id="main" class="wrap">
{{ content }}
</main>
<footer class="site-footer">
  <div class="wrap">
    <p>{{ footer }}</p>
  </div>
</footer>
<script src="{{ root }}til.js" defer></script>
</body>
</html>
